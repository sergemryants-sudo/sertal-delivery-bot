<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>SERTAL DELIVERY</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f3ee;--surface:#fff;--surface2:#faf8f3;--ink:#171717;--muted:#8a877f;--gold:#c8a34b;--gold2:#e7cb82;--gold3:#f5ead0;--dark:#151515;--line:#e8e3d8;--success:#24865b;--danger:#b94a48;--shadow:0 18px 55px rgba(28,24,16,.09);--radius:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:radial-gradient(circle at 90% 0,#fff8e7 0,transparent 28%),var(--bg);min-height:100vh}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{width:min(100%,760px);margin:auto;padding:18px 16px calc(112px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;margin:3px 2px 20px}.brand{display:flex;align-items:center;gap:11px}.mark{width:46px;height:46px;border-radius:15px;border:1.5px solid var(--gold);display:grid;place-items:center;background:linear-gradient(145deg,#fff,#f7eedc);position:relative;box-shadow:0 8px 25px rgba(200,163,75,.16)}.mark:after{content:"";width:17px;height:17px;border:2px solid var(--gold);border-radius:6px;transform:rotate(45deg)}.brandname{font-weight:900;letter-spacing:.18em;font-size:18px}.brandsub{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-top:2px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:800}.screen{animation:fade .22s ease}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{border-radius:30px;padding:27px;background:linear-gradient(135deg,#171717 0%,#25231f 68%,#b9943e 180%);color:#fff;box-shadow:0 22px 55px rgba(20,18,14,.2);position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:240px;height:240px;border:1px solid #e7cb8240;border-radius:50%;right:-85px;top:-100px}.hero:after{content:"";position:absolute;width:130px;height:130px;border:1px solid #e7cb8230;border-radius:50%;right:-30px;top:-45px}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--gold2);font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px var(--gold2)}h1{font-size:32px;line-height:1.05;letter-spacing:-.04em;margin:12px 0 11px;max-width:540px}.hero p{margin:0;color:#c8c5bd;line-height:1.55;max-width:560px}.gold{color:var(--gold2)}.actions{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-top:22px}.btn{min-height:50px;padding:13px 16px;border-radius:16px;background:linear-gradient(135deg,#e2c46f,#b99239);color:#18130a;font-weight:850;box-shadow:0 10px 25px rgba(200,163,75,.24)}.btn.dark{background:#fff;color:#171717;box-shadow:none}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.small{min-height:40px;padding:9px 12px;border-radius:13px;font-size:13px}.btn:active{transform:scale(.985)}.section{margin-top:22px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:0 2px 11px}.section-title h2{font-size:19px;margin:0;letter-spacing:-.02em}.section-title span{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.tile{background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:0 8px 30px rgba(34,30,22,.045)}.tile .icon{width:40px;height:40px;border-radius:13px;background:var(--gold3);display:grid;place-items:center;margin-bottom:13px;font-size:19px}.tile b{font-size:15px}.tile p{font-size:12px;color:var(--muted);line-height:1.45;margin:6px 0 0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 7px;text-align:center;color:var(--ink);font-weight:750}.quick i{display:block;font-style:normal;font-size:22px;margin-bottom:7px}.quick span{font-size:11px}.card{background:var(--surface);border:1px solid var(--line);border-radius:23px;padding:18px;box-shadow:0 10px 35px rgba(34,30,22,.055)}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);font-weight:750;margin:0 0 7px 2px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fcfbf8;color:var(--ink);border-radius:15px;padding:13px 14px;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c8a34b18}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:99px;background:var(--gold3);color:#80611f;font-size:10px;font-weight:900;letter-spacing:.04em}.order{background:var(--surface);border:1px solid var(--line);border-radius:21px;padding:16px;margin:10px 0;box-shadow:0 8px 30px rgba(34,30,22,.045)}.order-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.order-id{font-size:11px;color:var(--muted);font-weight:800}.order-title{font-size:17px;font-weight:850;margin:9px 0 7px}.order-meta{font-size:12px;color:var(--muted);line-height:1.55}.order-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:13px;padding-top:12px}.price{font-weight:900}.status-new{background:#f3ead5;color:#866521}.status-assigned{background:#ece9df;color:#625e53}.status-accepted{background:#e6f3ec;color:#24734f}.status-delivering{background:#e9f1f7;color:#3d647d}.status-delivered,.status-closed{background:#e8f4ed;color:#24734f}.status-cancelled{background:#f8e8e7;color:#a23e3b}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:15px}.stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:8px}.stat b{font-size:21px}.admin-hero{background:#171717;color:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow)}.admin-hero .eyebrow{color:var(--gold2)}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 1px 5px}.tabs button{white-space:nowrap;padding:9px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:750}.tabs button.active{background:#171717;color:#fff;border-color:#171717}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px 7px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-size:10px;text-transform:uppercase}.empty{text-align:center;padding:44px 20px;color:var(--muted)}.empty .big{font-size:38px;margin-bottom:8px}.notice{background:#fff8e5;border:1px solid #ead7a6;color:#75591c;border-radius:16px;padding:12px 14px;font-size:12px;line-height:1.5}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.9);border-top:1px solid var(--line);backdrop-filter:blur(18px);padding-bottom:env(safe-area-inset-bottom)}.bottom-inner{width:min(100%,760px);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 9px}.navbtn{background:transparent;color:#96928a;padding:6px 2px;font-size:10px;font-weight:700}.navbtn .ni{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.navbtn.active{color:#8b6b27}.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#171717;color:#fff;border:1px solid #ffffff18;border-radius:15px;padding:12px 16px;z-index:100;box-shadow:0 15px 40px rgba(0,0,0,.22);font-size:13px}.hidden{display:none!important}.login-wrap{min-height:calc(100vh - 90px);display:flex;align-items:center}.login-card{width:100%}.login-logo{text-align:center;margin-bottom:24px}.login-logo .mark{margin:auto;width:68px;height:68px;border-radius:22px}.login-logo .brandname{font-size:24px;margin-top:12px}.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:18px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.profile-head{display:flex;align-items:center;gap:13px}.profile-avatar{width:58px;height:58px;border-radius:20px;background:#171717;color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900}.list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.list-row small{display:block;color:var(--muted);margin-top:2px}.switch{width:54px;height:31px;border-radius:99px;background:#ddd9cf;padding:3px}.switch span{display:block;width:25px;height:25px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px #0002}.switch.on{background:var(--gold)}.switch.on span{transform:translateX(23px)}
@media(min-width:620px){.app{padding-left:22px;padding-right:22px}.hero{padding:34px}h1{font-size:40px}.cards{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(3,180px)}}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<main class="app">
  <header class="topbar"><div class="brand"><div class="mark"></div><div><div class="brandname">SERTAL</div><div class="brandsub">DELIVERY · ARMENIA</div></div></div><div id="avatar" class="avatar">S</div></header>
  <div id="app"></div>
</main>
<nav id="nav" class="bottom hidden"><div class="bottom-inner">
  <button class="navbtn" data-page="home"><span class="ni">⌂</span>Главная</button>
  <button class="navbtn" data-page="orders"><span class="ni">◷</span>Заказы</button>
  <button class="navbtn" data-page="new"><span class="ni">＋</span>Доставка</button>
  <button class="navbtn" data-page="profile"><span class="ni">◉</span>Профиль</button>
</div></nav>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.setHeaderColor?.('#f5f3ee');tg.setBackgroundColor?.('#f5f3ee');}
const tid=tg?.initDataUnsafe?.user?.id||null;let token=localStorage.getItem('sertal_token')||'';let role=localStorage.getItem('sertal_role')||'';let page='home';
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})};const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||'Ошибка сервера');return d}
function toast(x){const e=$('#toast');e.textContent=x;e.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.add('hidden'),2600)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(x){return `${Number(x||0).toLocaleString('ru-RU')} ֏`}
const statusNames={new:'Новый',assigned:'Назначен',accepted:'Принят',delivering:'В доставке',delivered:'Доставлен',closed:'Закрыт',cancelled:'Отменён'};
function statusBadge(s){return `<span class="badge status-${esc(s)}">${esc(statusNames[s]||s||'—')}</span>`}
function initials(n){return String(n||'S').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'S'}
async function login(phone){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({phone,telegram_id:tid})});setSession(d);await render()}catch(e){toast(e.message)}}
function setSession(d){token=d.token;role=d.role;localStorage.setItem('sertal_token',token);localStorage.setItem('sertal_role',role)}
async function register(){const name=$('#regName').value.trim(),phone=$('#regPhone').value.trim();if(!name||!phone)return toast('Заполните имя и телефон');try{setSession(await api('/api/register',{method:'POST',body:JSON.stringify({name,phone,telegram_id:tid})}));await render()}catch(e){toast(e.message)}}
async function businessRegister(){const company_name=$('#bizName').value.trim(),contact_name=$('#bizContact').value.trim(),phone=$('#bizPhone').value.trim();if(!company_name||!contact_name||!phone)return toast('Заполните данные компании');try{setSession(await api('/api/register-business',{method:'POST',body:JSON.stringify({company_name,contact_name,phone,telegram_id:tid})}));await render()}catch(e){toast(e.message)}}
function auth(){return `<div class="login-wrap"><div class="login-card"><div class="login-logo"><div class="mark"></div><div class="brandname">SERTAL</div><div class="brandsub">DELIVERY · ARMENIA</div></div><div class="card"><div class="eyebrow"><span class="dot"></span>Вход в приложение</div><h2 style="font-size:25px;margin:10px 0 6px">Всё для доставки — в одном месте.</h2><p style="color:var(--muted);font-size:13px;margin:0 0 18px">Клиенты, курьеры, рестораны и бизнес работают внутри одной системы.</p><div class="field"><label>Номер телефона</label><input id="phone" inputmode="tel" placeholder="+374 XX XXX XXX"></div><button class="btn" style="width:100%" onclick="login($('#phone').value)">Войти в SERTAL</button><div class="divider">или</div><div class="row"><button class="btn ghost" onclick="$('#reg').classList.toggle('hidden')">Регистрация</button><button class="btn ghost" onclick="$('#biz').classList.toggle('hidden')">Для бизнеса</button></div></div><div id="reg" class="card section hidden"><h3 style="margin:0 0 5px">Новый клиент</h3><p class="muted" style="margin:0 0 12px;font-size:12px">Создайте аккаунт за минуту.</p><div class="field"><label>Имя</label><input id="regName" placeholder="Ваше имя"></div><div class="field"><label>Телефон</label><input id="regPhone" inputmode="tel" placeholder="+374..."></div><button class="btn" style="width:100%" onclick="register()">Создать аккаунт</button></div><div id="biz" class="card section hidden"><h3 style="margin:0 0 5px">B2B кабинет</h3><p class="muted" style="margin:0 0 12px;font-size:12px">Для компаний и оптовых клиентов.</p><div class="field"><label>Компания</label><input id="bizName" placeholder="Название компании"></div><div class="field"><label>Контактное лицо</label><input id="bizContact" placeholder="Имя и фамилия"></div><div class="field"><label>Телефон</label><input id="bizPhone" inputmode="tel" placeholder="+374..."></div><button class="btn" style="width:100%" onclick="businessRegister()">Создать B2B кабинет</button></div></div></div>`}
async function home(){if(role==='admin')return adminHome();if(role==='courier')return courierHome();if(role==='business')return businessHome();const me=await api('/api/me');$('#avatar').textContent=initials(me.name);return `<div class="screen"><section class="hero"><div class="eyebrow"><span class="dot"></span>SERTAL DELIVERY</div><h1>Доставка без лишних <span class="gold">движений.</span></h1><p>Создайте заказ, выберите ресторан или просто следите за текущей доставкой.</p><div class="actions"><button class="btn" onclick="go('new')">Создать доставку</button><button class="btn dark" onclick="go('orders')">Мои заказы</button></div></section><section class="section"><div class="section-title"><h2>Быстрый доступ</h2><span>в один тап</span></div><div class="quick"><button onclick="go('new')"><i>＋</i><span>Новая доставка</span></button><button onclick="go('orders')"><i>◷</i><span>История заказов</span></button><button onclick="go('profile')"><i>◎</i><span>Мой профиль</span></button></div></section><section class="section"><div class="section-title"><h2>Возможности</h2></div><div class="cards"><div class="tile"><div class="icon">🛵</div><b>Курьер</b><p>Отслеживайте статус доставки.</p></div><div class="tile"><div class="icon">🍽</div><b>Рестораны</b><p>Заказы из подключённых заведений.</p></div><div class="tile"><div class="icon">📍</div><b>Адреса</b><p>Сохраняйте удобные точки доставки.</p></div><div class="tile"><div class="icon">◈</div><b>Оплата</b><p>Удобный способ оплаты заказа.</p></div></div></section></div>`}
async function orders(){let data=await api(role==='courier'?'/api/courier/orders':role==='business'?'/api/business/orders':'/api/customer/orders');if(role==='courier')data=data.orders||[];let html=`<div class="screen"><div class="section-title"><h2>Мои заказы</h2><span>${data.length} шт.</span></div>`;if(!data.length)html+=`<div class="card empty"><div class="big">◷</div><b>Пока здесь пусто</b><p>Созданные доставки появятся на этом экране.</p></div>`;for(const o of data){const actions=role==='courier'?courierActions(o):role==='customer'&&o.status==='delivered'?`<button class="btn small" onclick="confirmOrder(${o.id})">Подтвердить получение</button>`:'';html+=`<article class="order"><div class="order-top">${statusBadge(o.status)}<span class="order-id">№${o.id}</span></div><div class="order-title">${esc(o.title||'Доставка')}</div><div class="order-meta">📍 ${esc(o.address||'Адрес не указан')}</div>${o.restaurant_name?`<div class="order-meta">🍽 ${esc(o.restaurant_name)}</div>`:''}<div class="order-bottom"><span class="price">${money(o.price)}</span>${actions}</div></article>`}return html+'</div>'}
function courierActions(o){if(o.status==='assigned')return `<button class="btn small" onclick="courierAction(${o.id},'accept')">Принять</button>`;if(o.status==='accepted')return `<button class="btn small" onclick="courierAction(${o.id},'start')">Начать</button>`;if(o.status==='delivering')return `<button class="btn small" onclick="courierAction(${o.id},'complete')">Доставлено</button>`;return ''}
async function courierAction(id,a){try{await api(`/api/courier/orders/${id}/${a}`,{method:'POST'});toast('Статус обновлён');render()}catch(e){toast(e.message)}}
async function confirmOrder(id){try{await api(`/api/customer/orders/${id}/confirm`,{method:'POST'});toast('Получение подтверждено');render()}catch(e){toast(e.message)}}
function newOrder(){return `<div class="screen"><div class="section-title"><h2>Новая доставка</h2><span>быстро и понятно</span></div><div class="card"><div class="notice">Заполните основные данные. После создания заказ появится в системе и будет доступен для назначения курьеру.</div><div class="field"><label>Что доставить</label><input id="title" placeholder="Еда, документы, покупки…"></div><div class="field"><label>Адрес доставки</label><input id="address" placeholder="Улица, дом, квартира"></div><div class="field"><label>Откуда / ресторан</label><input id="rest" placeholder="Необязательно"></div><div class="row"><div class="field"><label>Вес, кг</label><input id="weight" type="number" min="0" step="0.1" value="0"></div><div class="field"><label>Стоимость</label><input id="price" type="number" min="0" value="0"></div></div><div class="field"><label>Получатель</label><input id="recipient" placeholder="Имя получателя"></div><div class="field"><label>Комментарий</label><textarea id="note" rows="4" placeholder="Этаж, подъезд, домофон и другие детали"></textarea></div><button class="btn" style="width:100%" onclick="createOrder()">Создать заказ</button></div></div>`}
async function createOrder(){try{const me=await api('/api/me');const body={phone:me.phone,title:$('#title').value.trim(),address:$('#address').value.trim(),restaurant_address:$('#rest').value.trim(),price:Number($('#price').value||0),weight_kg:Number($('#weight').value||0),recipient_name:$('#recipient').value.trim(),delivery_note:$('#note').value.trim()};if(!body.title||!body.address)return toast('Укажите, что доставить и адрес');await api('/api/admin/orders',{method:'POST',body:JSON.stringify(body)});toast('Заказ создан');go('orders')}catch(e){toast(e.message)}}
async function profile(){const me=await api('/api/me');$('#avatar').textContent=initials(me.name);return `<div class="screen"><div class="card"><div class="profile-head"><div class="profile-avatar">${initials(me.name)}</div><div><h2 style="margin:0;font-size:21px">${esc(me.name)}</h2><small class="muted">${esc(me.phone)}</small></div></div><div class="list-row" style="margin-top:14px"><div><b>Роль</b><small>${esc(role==='business'?'B2B · Бизнес':role)}</small></div>${statusBadge('accepted')}</div><div class="list-row"><div><b>Telegram</b><small>Аккаунт подключён</small></div><span>✓</span></div></div><div class="card section"><div class="list-row"><div><b>Мои данные</b><small>Имя и номер телефона</small></div><span>›</span></div><div class="list-row"><div><b>Поддержка</b><small>Связаться с менеджером</small></div><span>›</span></div><button class="btn ghost" style="width:100%;margin-top:15px" onclick="logout()">Выйти из аккаунта</button></div></div>`}
async function courierHome(){const me=await api('/api/me');const data=await api('/api/courier/orders');const active=(data.orders||[]).filter(o=>['assigned','accepted','delivering'].includes(o.status)).length;return `<div class="screen"><section class="hero"><div class="eyebrow"><span class="dot"></span>COURIER CENTER</div><h1>Работа курьера <span class="gold">под рукой.</span></h1><p>${esc(me.name)}, здесь доступны ваши доставки, статусы и быстрые действия.</p><div class="actions"><button class="btn" onclick="go('orders')">Открыть доставки</button><button class="btn dark" onclick="toggleOnline(${!data.online})">${data.online?'В сети':'Выйти на линию'}</button></div></section><section class="section statgrid"><div class="stat"><small>Статус</small><b>${data.online?'Онлайн':'Оффлайн'}</b></div><div class="stat"><small>Активные</small><b>${active}</b></div><div class="stat"><small>Сегодня</small><b>—</b></div></section><section class="section card"><div class="section-title"><h2>Совет</h2></div><p class="muted" style="margin:0;font-size:13px">Включайте статус «Онлайн», когда готовы принимать новые доставки.</p></section></div>`}
async function toggleOnline(v){try{await api('/api/courier/online',{method:'POST',body:JSON.stringify({online:v})});toast(v?'Вы в сети':'Вы оффлайн');render()}catch(e){toast(e.message)}}
async function businessHome(){const [s,p]=await Promise.all([api('/api/business/stats'),api('/api/business/profile')]);return `<div class="screen"><section class="hero"><div class="eyebrow"><span class="dot"></span>B2B · BUSINESS</div><h1>${esc(p.company_name)}<br><span class="gold">под контролем.</span></h1><p>Массовые доставки, статистика и история заказов в одном кабинете.</p><div class="actions"><button class="btn" onclick="go('new')">Новая доставка</button><button class="btn dark" onclick="go('orders')">Все заказы</button></div></section><section class="section statgrid"><div class="stat"><small>Всего заказов</small><b>${s.orders}</b></div><div class="stat"><small>В работе</small><b>${s.active}</b></div><div class="stat"><small>Оборот</small><b>${money(s.revenue)}</b></div></section><section class="section card"><div class="section-title"><h2>Массовая загрузка</h2><span>до 500</span></div><p class="muted" style="font-size:12px">Передайте список заказов в JSON-формате.</p><textarea id="bulk" rows="7" placeholder='[{"title":"Документы","address":"Комитаса 20","price":1500}]'></textarea><button class="btn" style="width:100%;margin-top:10px" onclick="bulkCreate()">Создать пакет</button></section></div>`}
async function bulkCreate(){try{const x=JSON.parse($('#bulk').value);if(!Array.isArray(x)||!x.length)throw Error('Добавьте хотя бы один заказ');const d=await api('/api/business/orders/bulk',{method:'POST',body:JSON.stringify({orders:x})});toast(`Создано заказов: ${d.created}`);go('orders')}catch(e){toast(e.message)}}
async function adminHome(){const s=await api('/api/admin/stats');return `<div class="screen"><section class="admin-hero"><div class="eyebrow"><span class="dot"></span>ADMIN CONTROL</div><h1 style="margin-top:10px">SERTAL <span class="gold">Control.</span></h1><p style="color:#aaa;margin:0">Управление операциями, клиентами и курьерами.</p></section><section class="section statgrid"><div class="stat"><small>Клиенты</small><b>${s.customers}</b></div><div class="stat"><small>Курьеры</small><b>${s.couriers}</b></div><div class="stat"><small>Активные</small><b>${s.active_orders}</b></div><div class="stat"><small>Доставлены</small><b>${s.delivered}</b></div><div class="stat"><small>Закрыты</small><b>${s.closed}</b></div><div class="stat"><small>Оборот</small><b>${money(s.revenue)}</b></div></section><section class="section card"><div class="tabs"><button class="active" onclick="adminList('orders',this)">Заказы</button><button onclick="adminList('customers',this)">Клиенты</button><button onclick="adminList('couriers',this)">Курьеры</button><button onclick="adminList('restaurants',this)">Рестораны</button></div><div id="adminList" class="section" style="margin-top:10px"></div></section></div>`}
async function adminList(type,el){try{$$('.tabs button').forEach(x=>x.classList.remove('active'));el?.classList.add('active');const d=await api('/api/admin/'+type);const a=Array.isArray(d)?d:[];$('#adminList').innerHTML=!a.length?'<div class="empty">Нет данных</div>':`<div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Объект</th><th>Статус</th><th>Сумма</th></tr></thead><tbody>${a.slice(0,100).map(x=>`<tr><td>#${x.id}</td><td>${esc(x.name||x.title||'—')}</td><td>${x.status?statusBadge(x.status):esc(x.role||'—')}</td><td>${x.price!=null?money(x.price):'—'}</td></tr>`).join('')}</tbody></table></div>`}catch(e){toast(e.message)}}
function logout(){token='';role='';localStorage.removeItem('sertal_token');localStorage.removeItem('sertal_role');$('#avatar').textContent='S';render()}
function go(p){page=p;render()}
async function render(){if(!token){$('#nav').classList.add('hidden');$('#app').innerHTML=auth();return}$('#nav').classList.remove('hidden');$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));try{let html=page==='home'?await home():page==='orders'?await orders():page==='new'?newOrder():await profile();$('#app').innerHTML=html}catch(e){toast(e.message);if(/авториза|сесс|token/i.test(e.message))logout()}}
$$('.navbtn').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script>
</body>
</html>
